name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run of the same branch replaces the one still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon asks for JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json and the release keystore are not in the repo, so this builds
      # without sign-in configuration, which is enough to check that the code compiles.
      - name: Build and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
